    "Faster, trickier items": "আৰু বেগী, কঠিন সামগ্ৰী",
    "Final round. Fastest": "অন্তিম ৰাউণ্ড। আটাইতকৈ বেগী",
    "✅ Round {0} cleared!": "✅ ৰাউণ্ড {0} পাৰ হ'ল!",
    "Round {0} not cleared": "ৰাউণ্ড {0} পাৰ নহ'ল",
    "Total so far: {0} points": "এতিয়ালৈকে মুঠ: {0} পইণ্ট",
    "You need {0} points to move to the next round. Check the answers and try again.": "পৰৱৰ্তী ৰাউণ্ডলৈ যাবলৈ {0} পইণ্ট লাগিব। উত্তৰবোৰ চাই আকৌ চেষ্টা কৰক।",
    "correct": "শুদ্ধ",
    "wrong": "ভুল",
    "missed": "বাদ পৰিল",
    "Correct answers": "শুদ্ধ উত্তৰ",
    "✅ Correct": "✅ শুদ্ধ",
    "❌ Wrong bin": "❌ ভুল বিন",
    "⏱ Missed": "⏱ বাদ পৰিল",
    "🔁 Try round {0} again": "🔁 ৰাউণ্ড {0} আকৌ খেলক",
    "See your final result": "চূড়ান্ত ফলাফল চাওক",
    "▶ Next round ({0} of {1})": "▶ পৰৱৰ্তী ৰাউণ্ড ({0}/{1})",
    "Congratulations!": "অভিনন্দন!",
    "You have cleared all {0} rounds.": "আপুনি {0} টা ৰাউণ্ডেই পাৰ হ'ল।",
    "{0} points": "{0} পইণ্ট",
    "out of {0}": "{0}ৰ ভিতৰত",
    "Best": "শ্ৰেষ্ঠ",
    "Now make your home, your village and your area clean.": "এতিয়া আপোনাৰ ঘৰ, গাঁও আৰু অঞ্চল পৰিষ্কাৰ কৰি ৰাখক।",
    "Segregate your waste into 4 streams every day:": "প্ৰতিদিনে আৱৰ্জনা ৪ ভাগত পৃথক কৰক:",
    "Share on WhatsApp": "WhatsApp-ত শ্বেয়াৰ কৰক",
    "▶ Play again": "▶ আকৌ খেলক",
    "What goes in:": "কি কি পৰে:",
    "Where it goes:": "ক'লৈ যায়:",
    "Tap to close": "বন্ধ কৰিবলৈ টিপক" };
  var lang = "en";
  try{ lang = localStorage.getItem("swm4lang") || "en"; }catch(_){}
  function tr(s, a, b){
    var o = (lang === "as" && AS[s]) || s;
    return o.replace("{0}", a).replace("{1}", b);
  }
  function full(k){ return tr(k === "spc" ? "Special care waste" : CATS[k].name); }

  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), binsEl = $("bins"), capEl = $("caption"), subEl = $("sub"),
      cardEl = $("card"), fsBtn = $("fs"), startBtn = $("start"), headerEl = document.querySelector("header");

  var W = 0, H = 0, binTop = 0, binRect = {}, binEls = {};
  var items = [], nextSpawn = 0, last = 0, bag = [];
  var mode = "demo", round = null, game = null, catBag = {}, lastTouch = 0, best = 0;
  try{ best = parseInt(localStorage.getItem("swm4best") || "0", 10) || 0; }catch(_){}

  ORDER.forEach(function(k){
    var c = CATS[k], b = document.createElement("div");
    b.className = "bin"; b.style.setProperty("--c", c.color);
    b.innerHTML = '<div class="lid"></div><div class="body"><div class="i">'+c.icon+
      '</div><div class="n"></div><div class="g"></div></div>';
    b.addEventListener("click", function(){ if(mode === "demo") showInfo(k); });
    binsEl.appendChild(b); binEls[k] = b;
  });

  function applyLang(){
    document.documentElement.lang = lang === "as" ? "as" : "en";
    $("title").innerHTML = lang === "as" ? "<span>৪</span> ভাগত পৃথক কৰক" : "Segregate in <span>4</span>";
    $("tag").textContent = tr("SWM Rules 2026");
    $("lang").textContent = lang === "as" ? "English" : "অসমীয়া";
    startBtn.textContent = tr("▶ Start game");
    ORDER.forEach(function(k){
      binEls[k].querySelector(".n").textContent = tr(CATS[k].name);
      binEls[k].querySelector(".g").textContent = tr(CATS[k].goes);
    });
    items.forEach(function(it){ it.el.querySelector(".l").textContent = tr(it.label); });
  }
  function layout(){
    W = window.innerWidth; H = window.innerHeight;
    ORDER.forEach(function(k){ binRect[k] = binEls[k].getBoundingClientRect(); });
    binTop = binRect.wet.top;
    startBtn.style.bottom = (H - binTop + 22) + "px";
  }
  applyLang();
  $("lang").addEventListener("click", function(){
    lang = lang === "as" ? "en" : "as";
    try{ localStorage.setItem("swm4lang", lang); }catch(_){}
    applyLang(); hideCard(); fi = Math.max(0, fi - 1); fact(); setTimeout(layout, 50);
  });
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 300); });
  layout();

  function shuffled(){
    var a = [];
    ORDER.forEach(function(k){ CATS[k].items.forEach(function(it){ a.push([k,it[0],it[1]]); }); });
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function mix(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // First attempt at a round: its own slice of each list, so a clean run never repeats an item.
  // Retry after failing: a fresh random mix from everything up to that round's difficulty.
  function drawRound(l, attempt){
    var q = [];
    ORDER.forEach(function(k){
      var all = CATS[k].items.map(function(it){ return [k,it[0],it[1]]; }), from = 0;
      for(var i = 0; i < l; i++) from += LEVELS[i].mix[k];
      var n = LEVELS[l].mix[k];
      var pick = attempt === 1 ? all.slice(from, from + n) : mix(all.slice(0, from + n)).slice(0, n);
      q = q.concat(pick);
    });
    return mix(q);
  }
  function headerBottom(){ return headerEl.getBoundingClientRect().bottom; }

  function spawn(d){
    var el = document.createElement("div");
    el.className = "item";
    el.innerHTML = '<div class="e">'+d[1]+'</div><div class="l">'+tr(d[2])+'</div>';
    var it = { el:el, cat:d[0], emoji:d[1], label:d[2], x: 56 + Math.random()*(W-112),
               y: headerBottom() + 30, state:"fall", phase:Math.random()*6, alpha:0 };
    el.style.opacity = 0;
    el.addEventListener("pointerdown", function(e){ grab(it, e); });
    el.addEventListener("pointermove", function(e){ if(it.state === "drag"){ it.x = e.clientX; it.y = e.clientY - 20; } });
    el.addEventListener("pointerup", function(e){ drop(it, e); });
    el.addEventListener("pointercancel", function(){ if(it.state === "drag"){ it.state = "fall"; el.classList.remove("drag"); } });
    stage.appendChild(el); items.push(it);
  }
  function clearItems(){ items.forEach(function(it){ it.el.remove(); }); items = []; }

  function grab(it, e){
    if(mode !== "round" || it.state !== "fall") return;
    e.preventDefault();
    it.state = "drag"; it.el.classList.add("drag");
    try{ it.el.setPointerCapture(e.pointerId); }catch(_){}
    it.x = e.clientX; it.y = e.clientY - 20;
  }
  function drop(it, e){
    if(it.state !== "drag") return;
    it.el.classList.remove("drag");
    var hit = null;
    ORDER.forEach(function(k){
      var r = binRect[k];
      if(e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top - 50) hit = k;
    });
    if(hit) resolve(it, hit === it.cat ? "right" : "wrong", hit);
    else it.state = "fall";
  }

  // One attempt per item. No hint is shown about the correct bin during a round.
  function resolve(it, res, binKey){
    it.state = "done"; it.el.classList.add("gone");
    setTimeout(function(){ it.el.remove(); }, 300);
    round.results.push({ cat:it.cat, emoji:it.emoji, label:it.label, res:res });
    if(res === "right"){ round.score += RIGHT; pulse(binKey); pop("+" + RIGHT, "#7CFC9A", binKey); }
    else if(res === "wrong"){
      round.score += WRONG; pop(String(WRONG), "#ff8a80", binKey);
      var b = binEls[binKey]; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
    }
    hud();
  }
  function pulse(k){ var b = binEls[k]; b.classList.add("pulse"); setTimeout(function(){ b.classList.remove("pulse"); }, 450); }
  function pop(text, color, k){
    var s = document.createElement("div"); s.className = "spark"; s.textContent = text; s.style.color = color;
    var r = binRect[k]; s.style.left = (r.left + r.width/2 - 18) + "px"; s.style.top = (r.top - 34) + "px";
    stage.appendChild(s); setTimeout(function(){ s.remove(); }, 800);
  }
  function hud(){
    subEl.classList.toggle("neg", round.score < 0);
    subEl.innerHTML = tr("Round") + " " + game.round + "/" + ROUNDS + " &nbsp;·&nbsp; " + tr("Item") + " " +
      Math.min(round.size, round.results.length + 1) + "/" + round.size + "<br>" + tr("Points") + ": <b>" + round.score +
      "</b> &nbsp;·&nbsp; " + tr("Need {0} to clear", round.pass);
  }

  function startRound(retry){
    hideCard(); clearItems(); capEl.classList.remove("show");
    if(!game || (!retry && game.round >= ROUNDS)) game = { round: 0, total: 0, attempt: 0 };
    if(retry === true) game.attempt++; else { game.round++; game.attempt = 1; }
    var l = game.round - 1;
    mode = "round"; round = { lvl: LEVELS[l], size: sizeOf(l), pass: passMark(l),
                              queue: drawRound(l, game.attempt), results: [], score: 0 };
    say(tr("Round {0} of {1}", game.round, ROUNDS) + " · " + tr(LEVELS[l].note), "#f2c94c");
    $("lang").style.display = "none";
    startBtn.style.display = "none"; subEl.style.opacity = 1; hud();
    nextSpawn = 0; lastTouch = performance.now();
  }
  function endRound(){
    mode = "results"; lastTouch = performance.now();
    var n = { right:0, wrong:0, missed:0 };
    round.results.forEach(function(r){ n[r.res]++; });
    var passed = round.score >= round.pass, lastRound = game.round >= ROUNDS, maxPts = round.size * RIGHT;
    if(passed) game.total += round.score;
    var mark = { right:tr("✅ Correct"), wrong:tr("❌ Wrong bin"), missed:tr("⏱ Missed") };
    var h = "<h2>" + tr(passed ? "✅ Round {0} cleared!" : "Round {0} not cleared", game.round) +
      "</h2><div class='big" + (passed ? "" : " neg") + "'>" + round.score + " / " + maxPts + "</div><div class='tally'>" +
      (passed ? tr("Total so far: {0} points", game.total) : tr("You need {0} points to move to the next round. Check the answers and try again.", round.pass)) +
      "<br>✅ " + n.right + " " + tr("correct") + " &nbsp; ❌ " + n.wrong + " " + tr("wrong") + " &nbsp; ⏱ " + n.missed + " " + tr("missed") +
      "</div><h3>" + tr("Correct answers") + "</h3>";
    ORDER.forEach(function(k){
      var rows = round.results.filter(function(r){ return r.cat === k; });
      if(!rows.length) return;
      var c = CATS[k];
      h += "<div class='grp' style='--g:" + c.color + "'><div class='t'>" + c.icon + " " + full(k) + "</div><div class='w'>" + tr(c.where) + "</div>";
      rows.forEach(function(r){ h += "<div class='r'><span>" + r.emoji + " " + tr(r.label) + "</span><span>" + mark[r.res] + "</span></div>"; });
      h += "</div>";
    });
    h += "<button id='again'>" + (!passed ? tr("🔁 Try round {0} again", game.round) :
      lastRound ? tr("See your final result") : tr("▶ Next round ({0} of {1})", game.round + 1, ROUNDS)) + "</button>";
    cardEl.style.setProperty("--c", passed ? "#2e9e5b" : "#d9453d");
    cardEl.innerHTML = h; cardEl.scrollTop = 0;
    cardEl.classList.add("show");
    $("again").addEventListener("click", function(e){ e.stopPropagation(); if(!passed) startRound(true); else if(lastRound) congrats(); else startRound(); });
    subEl.innerHTML = "";
  }
  function congrats(){
    lastTouch = performance.now();
    if(game.total > best){ best = game.total; try{ localStorage.setItem("swm4best", String(best)); }catch(_){} }
    var max = 0; for(var q = 0; q < ROUNDS; q++) max += sizeOf(q) * RIGHT;
    cardEl.style.setProperty("--c", "#f2c94c");
    var h = "<div style='text-align:center'><div style='font-size:54px'>🎉</div><h2>" + tr("Congratulations!") + "</h2>" +
      "<p>" + tr("You have cleared all {0} rounds.", ROUNDS) + "</p><div class='big" + (game.total < 0 ? " neg" : "") + "'>" + tr("{0} points", game.total) +
      "</div><div class='tally'>" + tr("out of {0}", max) + " &nbsp;·&nbsp; " + tr("Best") + ": " + best + "</div>" +
      "<p style='font-size:17px;color:#fff'><b>" + tr("Now make your home, your village and your area clean.") + "</b></p>" +
      "<p>" + tr("Segregate your waste into 4 streams every day:") + "</p></div>";
    ORDER.forEach(function(k){
      var c = CATS[k];
      h += "<div class='grp' style='--g:" + c.color + "'><div class='t'>" + c.icon + " " + full(k) + "</div><div class='w'>" + tr(c.where) + "</div></div>";
    });
    if(/^https?:/.test(location.protocol)){
      var msg = "I scored " + game.total + " points in Segregate in 4, the SWM Rules 2026 waste segregation game. Can you beat me? " + location.href.split("#")[0];
      h += "<button id='wa' style='background:#25D366;color:#fff'>" + tr("Share on WhatsApp") + "</button>";
    }
    h += "<button id='again'>" + tr("▶ Play again") + "</button>";
    cardEl.innerHTML = h; cardEl.scrollTop = 0; cardEl.classList.add("show");
    $("again").addEventListener("click", function(e){ e.stopPropagation(); startRound(); });
    subEl.innerHTML = "";
    if($("wa")) $("wa").addEventListener("click", function(e){ e.stopPropagation(); window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank"); });
    for(var i = 0; i < 18; i++){ (function(i){ setTimeout(function(){
      var s = document.createElement("div"); s.className = "spark"; s.style.zIndex = 10;
      s.textContent = ["🎉","✨","🌱","♻️"][i % 4];
      s.style.left = (Math.random()*(W-30)) + "px"; s.style.top = (H*0.25 + Math.random()*H*0.5) + "px";
      stage.appendChild(s); setTimeout(function(){ s.remove(); }, 800);
    }, i*110); })(i); }
  }
  function toDemo(){
    hideCard(); clearItems(); mode = "demo"; round = null; game = null; subEl.classList.remove("neg");
    startBtn.style.display = ""; $("lang").style.display = ""; nextSpawn = 0; fact();
  }
  startBtn.addEventListener("click", function(){ startRound(); });

  // Demo mode helpers: captions, facts and bin info cards
  var capTimer = 0, cardTimer = 0, fi = 0;
  function say(text, color){
    capEl.textContent = text; capEl.style.borderColor = color; capEl.classList.add("show");
    clearTimeout(capTimer); capTimer = setTimeout(function(){ capEl.classList.remove("show"); }, 3200);
  }
  function showInfo(k){
    var c = CATS[k];
    cardEl.style.setProperty("--c", c.color);
    cardEl.innerHTML = "<h2>"+c.icon+" "+full(k)+"</h2><p><b>"+tr("What goes in:")+"</b> "+tr(c.what)+
      "</p><p><b>"+tr("Where it goes:")+"</b> "+tr(c.where)+"</p><small>"+tr("Tap to close")+"</small>";
    cardEl.classList.add("show");
    clearTimeout(cardTimer); cardTimer = setTimeout(function(){ if(mode === "demo") hideCard(); }, 8000);
  }
  function hideCard(){ cardEl.classList.remove("show"); }
  cardEl.addEventListener("click", function(){ if(mode === "demo") hideCard(); });
  function fact(){
    if(mode !== "demo") return;
    subEl.style.opacity = 0;
    setTimeout(function(){ if(mode !== "demo") return; subEl.textContent = tr(FACTS[fi % FACTS.length]); fi++; subEl.style.opacity = 1; }, 400);
  }
  fact(); setInterval(fact, 6000);

  function tick(t){
    var dt = Math.min(0.05, (t - last)/1000); last = t;
    var top0 = headerBottom() + 30, span = Math.max(80, binTop - top0);
    var demo = mode === "demo";
    var speed = span / (demo || !round ? 8 : round.lvl.fall);

    if(demo && t > nextSpawn && items.length < (W > 700 ? 7 : 5)){
      if(!bag.length) bag = shuffled();
      spawn(bag.pop()); nextSpawn = t + 1900;
    }
    if(mode === "round" && round.queue.length && t > nextSpawn && items.length < round.lvl.max){
      spawn(round.queue.pop()); nextSpawn = t + round.lvl.gap;
    }

    for(var i = items.length - 1; i >= 0; i--){
      var it = items[i];
      if(it.state === "done"){ items.splice(i,1); continue; }
      it.alpha = Math.min(1, it.alpha + dt*2);
      if(it.state === "fall"){
        it.y += speed*dt; it.phase += dt;
        if(demo && it.y > top0 + span*0.28){
          var r = binRect[it.cat];
          it.x += (r.left + r.width/2 - it.x) * Math.min(1, dt*2.4);
        }
        if(it.y >= binTop - 8){
          if(demo){
            it.state = "done"; it.el.classList.add("gone");
            (function(el){ setTimeout(function(){ el.remove(); }, 300); })(it.el);
            pulse(it.cat); say(it.emoji + " " + tr(it.label) + " → " + tr(CATS[it.cat].name), CATS[it.cat].color);
          } else { resolve(it, "missed", null); }
          continue;
        }
      }
      var sway = it.state === "drag" ? 0 : Math.sin(it.phase*1.3) * (demo || !round ? 10 : round.lvl.sway);
      var x = Math.max(46, Math.min(W-46, it.x + sway));
      it.el.style.opacity = it.alpha;
      it.el.style.transform = "translate("+x+"px,"+it.y+"px) translate(-50%,-50%)";
    }

    if(mode === "round" && !round.queue.length && !items.length && round.results.length >= round.size) endRound();
    if(mode === "results" && t - lastTouch > 60000) toDemo();   // back to screensaver when left alone
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(function(t){ last = t; tick(t); });

  // Keep the screen awake (works after the first touch on supported browsers)
  var lock = null;
  function wake(){
    if(!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l; l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  document.addEventListener("pointerdown", function(){ lastTouch = performance.now(); wake(); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible"){ wake(); layout(); } });
  wake();

  var root = document.documentElement;
  var reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
  var standalone = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
  if(reqFs && !standalone){
    fsBtn.style.display = "block";
    fsBtn.addEventListener("click", function(){
      if(document.fullscreenElement || document.webkitFullscreenElement){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else { reqFs.call(root); }
      setTimeout(layout, 400);
    });
  }
})();
</script>
</body>
