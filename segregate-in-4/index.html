<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Segregate in 4">
<meta name="theme-color" content="#07130e">
<title>Segregate in 4 | SWM Rules 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#07130e;color:#eef5f0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0;
    background:radial-gradient(120% 80% at 50% 0%,#12352a 0%,#0a1c15 55%,#07130e 100%)}
  header{position:absolute;top:0;left:0;right:0;text-align:center;z-index:5;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 56px 0}
  h1{font-size:clamp(22px,6.4vw,36px);font-weight:800;line-height:1.1}
  h1 span{color:#f2c94c}
  #tag{font-size:clamp(11px,3vw,15px);letter-spacing:1.5px;text-transform:uppercase;color:#8fb3a2;margin-top:3px}
  #sub{margin-top:8px;font-size:clamp(14px,3.9vw,20px);color:#b9d3c6;min-height:1.4em;transition:opacity .4s}
  #sub b{color:#f2c94c;font-size:1.15em}
  #sub.neg b{color:#ff8a80}
  #caption{margin:8px auto 0;display:inline-block;padding:6px 14px;border-radius:999px;
    font-size:clamp(14px,4vw,20px);font-weight:700;background:rgba(255,255,255,.08);
    border:2px solid transparent;opacity:0;transition:opacity .3s,border-color .3s}
  #caption.show{opacity:1}
  #fs{position:absolute;z-index:6;right:calc(env(safe-area-inset-right,0px) + 10px);
    top:calc(env(safe-area-inset-top,0px) + 8px);width:38px;height:38px;border-radius:10px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#cfe3d8;
    font-size:18px;display:none}
  #start{position:absolute;z-index:6;left:50%;transform:translateX(-50%);padding:12px 26px;
    border-radius:999px;border:0;background:#f2c94c;color:#10241b;font-size:clamp(16px,4.4vw,20px);
    font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:breathe 2.4s ease-in-out infinite;white-space:nowrap}
  @keyframes breathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  .item{position:absolute;left:0;top:0;width:92px;text-align:center;z-index:3;
    will-change:transform;touch-action:none}
  .item .e{font-size:44px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .item .l{display:inline-block;margin-top:2px;padding:2px 7px;border-radius:8px;font-size:12px;
    font-weight:600;background:rgba(0,0,0,.45);color:#f3f8f5;white-space:nowrap}
  .item.drag{z-index:8}
  .item.drag .e{font-size:56px}
  .item.gone{transition:opacity .28s;opacity:0}
  #bins{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;
    height:clamp(128px,25vh,200px);
    padding:0 calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 10px)
            calc(env(safe-area-inset-left,0px) + 8px)}
  .bin{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative}
  .lid{width:104%;height:12px;border-radius:7px 7px 2px 2px;background:var(--c);
    filter:brightness(1.25);transform-origin:8% 100%;transition:transform .25s}
  .lid:before{content:"";position:absolute;left:38%;right:38%;top:-6px;height:7px;
    border-radius:5px 5px 0 0;background:var(--c)}
  .body{flex:1;width:92%;margin-top:3px;border-radius:4px 4px 16px 16px;background:var(--c);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:4px 3px;text-align:center;box-shadow:inset 0 -18px 30px rgba(0,0,0,.28),0 6px 18px rgba(0,0,0,.45);
    transition:filter .25s,transform .25s}
  .body .i{font-size:clamp(20px,6vw,30px)}
  .body .n{font-size:clamp(12px,3.5vw,18px);font-weight:800;color:#fff;line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .body .g{font-size:clamp(9.5px,2.6vw,13px);color:rgba(255,255,255,.92);line-height:1.15}
  .bin.pulse .lid{transform:rotate(-24deg)}
  .bin.pulse .body{filter:brightness(1.35);transform:scale(1.04)}
  .bin.no .body{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
    60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  #card{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);
    width:min(92vw,440px);max-height:86vh;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    padding:18px;border-radius:18px;background:#0f2a20;
    border:3px solid var(--c,#f2c94c);box-shadow:0 20px 60px rgba(0,0,0,.7);opacity:0;
    pointer-events:none;transition:opacity .25s,transform .25s}
  #card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #card h2{font-size:22px;margin-bottom:6px}
  #card p{font-size:15px;line-height:1.4;color:#d5e6dc;margin-top:6px}
  #card b{color:#fff}
  #card small{display:block;margin-top:10px;color:#86a898;font-size:12px}
  #card .big{font-size:40px;font-weight:800;color:#f2c94c;line-height:1.1}
  #card .big.neg{color:#ff8a80}
  #card .tally{font-size:14px;color:#b9d3c6;margin:4px 0 12px}
  #card h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#8fb3a2;margin:6px 0}
  .grp{border-left:5px solid var(--g);background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;margin-top:8px}
  .grp .t{font-weight:800;font-size:15px}
  .grp .w{font-size:12px;color:#b9d3c6;margin-bottom:4px}
  .grp .r{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}
  .grp .r span:last-child{white-space:nowrap;font-size:13px;color:#b9d3c6}
  #card button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:#f2c94c;
    color:#10241b;font-size:17px;font-weight:800}
  .spark{position:absolute;z-index:7;font-size:24px;font-weight:800;pointer-events:none;
    text-shadow:0 2px 4px rgba(0,0,0,.7);animation:up .8s ease-out forwards}
  @keyframes up{to{transform:translateY(-60px) scale(1.4);opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <button id="fs" aria-label="Full screen">⛶</button>
  <header>
    <h1>Segregate in <span>4</span></h1>
    <div id="tag">SWM Rules 2026</div>
    <div id="sub"></div>
    <div id="caption"></div>
  </header>
  <button id="start">▶ Play 4 rounds</button>
  <div id="bins"></div>
  <div id="card"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Content (edit here to change wording, items or bin colours) ----------
  var CATS = {
    wet: { name:"Wet waste", color:"#2e9e5b", icon:"🌱", goes:"Compost or biogas",
      what:"Kitchen waste, vegetable and fruit peels, leftover food, meat and fish waste, flowers.",
      where:"Compost it, or send it for bio-methanation at the nearest facility.",
      items:[["🍌","Banana peel"],["🥬","Vegetable waste"],["🍚","Leftover rice"],["🌸","Used flowers"],
             ["🐟","Fish waste"],["🥚","Eggshells"],["🍵","Used tea leaves"],["🍖","Meat bones"],
             ["🍞","Stale bread"],["🍅","Rotten tomato"],["🍎","Apple core"],["🍊","Orange peel"],
             ["🧅","Onion peels"],["🥔","Potato peels"],["🍛","Leftover curry"],["🍉","Watermelon rind"]] },
    dry: { name:"Dry waste", color:"#2f7fd6", icon:"♻️", goes:"To MRF for recycling",
      what:"Plastic, paper, cardboard, metal, glass and similar dry items.",
      where:"Goes to a Material Recovery Facility (MRF) for sorting and recycling.",
      items:[["🧴","Plastic bottle"],["📰","Newspaper"],["🥫","Tin can"],["🍾","Glass bottle"],
             ["📦","Cardboard box"],["🛍️","Plastic bag"],["🥤","Plastic cup"],["📄","Waste paper"],
             ["🧃","Juice carton"],["🍫","Chocolate wrapper"],["📚","Old books"],["👟","Old shoe"],
             ["👕","Old clothes"],["🔩","Metal scrap"],["🥛","Milk packet"],["✉️","Envelope"],
             ["🧾","Paper bills"],["🔑","Old keys"],["📒","Old notebook"],["🥄","Bent steel spoon"]] },
    san: { name:"Sanitary waste", color:"#d9453d", icon:"🧻", goes:"Wrap, keep separate",
      what:"Used diapers, sanitary napkins, tampons and similar hygiene waste.",
      where:"Wrap it securely and store it separately from all other waste.",
      items:[["👶","Used baby diaper"],["🩸","Sanitary napkin"],["🚺","Tampon"],["🧓","Adult diaper"]] },
    spc: { name:"Special care", color:"#c98a12", icon:"⚠️", goes:"Authorised collection",
      what:"Bulbs, batteries, expired medicines, paint cans, mercury thermometers.",
      where:"Hand over only to an authorised agency or a designated collection centre.",
      items:[["💡","LED bulb"],["💡","CFL bulb"],["💡","Tube light"],["🔋","Used battery"],
             ["💊","Expired tablets"],["🧪","Expired syrup"],["🌡️","Mercury thermometer"],["🎨","Paint can"]] }
  };
  var ORDER = ["wet","dry","san","spc"];
  var FACTS = [
    "Segregate waste at source into 4 streams",
    "Wet waste: compost it or send it for bio-methanation",
    "Dry waste: goes to a Material Recovery Facility",
    "Sanitary waste: wrap securely and keep separate",
    "Special care waste: only to authorised collection",
    "SWM Rules 2026 are in force from 1 April 2026",
    "Never mix. Mixed waste cannot be composted or recycled"
  ];
  // -------------------------------------------------------------------------------
  var ROUNDS = 4, RIGHT = 10, WRONG = -5;
  var MIX = { wet:4, dry:5, san:1, spc:2 };      // items per stream in each round
  var ROUND_SIZE = MIX.wet + MIX.dry + MIX.san + MIX.spc;

  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), binsEl = $("bins"), capEl = $("caption"), subEl = $("sub"),
      cardEl = $("card"), fsBtn = $("fs"), startBtn = $("start"), headerEl = document.querySelector("header");

  var W = 0, H = 0, binTop = 0, binRect = {}, binEls = {};
  var items = [], nextSpawn = 0, last = 0, bag = [];
  var mode = "demo", round = null, game = null, catBag = {}, lastTouch = 0, best = 0;
  try{ best = parseInt(localStorage.getItem("swm4best") || "0", 10) || 0; }catch(_){}

  ORDER.forEach(function(k){
    var c = CATS[k], b = document.createElement("div");
    b.className = "bin"; b.style.setProperty("--c", c.color);
    b.innerHTML = '<div class="lid"></div><div class="body"><div class="i">'+c.icon+
      '</div><div class="n">'+c.name+'</div><div class="g">'+c.goes+'</div></div>';
    b.addEventListener("click", function(){ if(mode === "demo") showInfo(k); });
    binsEl.appendChild(b); binEls[k] = b;
  });

  function layout(){
    W = window.innerWidth; H = window.innerHeight;
    ORDER.forEach(function(k){ binRect[k] = binEls[k].getBoundingClientRect(); });
    binTop = binRect.wet.top;
    startBtn.style.bottom = (H - binTop + 22) + "px";
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 300); });
  layout();

  function shuffled(){
    var a = [];
    ORDER.forEach(function(k){ CATS[k].items.forEach(function(it){ a.push([k,it[0],it[1]]); }); });
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function mix(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // Each stream has its own bag, so no item repeats until that stream's list is used up
  function drawRound(){
    var q = [];
    ORDER.forEach(function(k){
      for(var n = 0; n < MIX[k]; n++){
        if(!catBag[k] || !catBag[k].length) catBag[k] = mix(CATS[k].items.map(function(it){ return [k,it[0],it[1]]; }));
        q.push(catBag[k].pop());
      }
    });
    return mix(q);
  }
  function headerBottom(){ return headerEl.getBoundingClientRect().bottom; }

  function spawn(d){
    var el = document.createElement("div");
    el.className = "item";
    el.innerHTML = '<div class="e">'+d[1]+'</div><div class="l">'+d[2]+'</div>';
    var it = { el:el, cat:d[0], emoji:d[1], label:d[2], x: 56 + Math.random()*(W-112),
               y: headerBottom() + 30, state:"fall", phase:Math.random()*6, alpha:0 };
    el.style.opacity = 0;
    el.addEventListener("pointerdown", function(e){ grab(it, e); });
    el.addEventListener("pointermove", function(e){ if(it.state === "drag"){ it.x = e.clientX; it.y = e.clientY - 20; } });
    el.addEventListener("pointerup", function(e){ drop(it, e); });
    el.addEventListener("pointercancel", function(){ if(it.state === "drag"){ it.state = "fall"; el.classList.remove("drag"); } });
    stage.appendChild(el); items.push(it);
  }
  function clearItems(){ items.forEach(function(it){ it.el.remove(); }); items = []; }

  function grab(it, e){
    if(mode !== "round" || it.state !== "fall") return;
    e.preventDefault();
    it.state = "drag"; it.el.classList.add("drag");
    try{ it.el.setPointerCapture(e.pointerId); }catch(_){}
    it.x = e.clientX; it.y = e.clientY - 20;
  }
  function drop(it, e){
    if(it.state !== "drag") return;
    it.el.classList.remove("drag");
    var hit = null;
    ORDER.forEach(function(k){
      var r = binRect[k];
      if(e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top - 50) hit = k;
    });
    if(hit) resolve(it, hit === it.cat ? "right" : "wrong", hit);
    else it.state = "fall";
  }

  // One attempt per item. No hint is shown about the correct bin during a round.
  function resolve(it, res, binKey){
    it.state = "done"; it.el.classList.add("gone");
    setTimeout(function(){ it.el.remove(); }, 300);
    round.results.push({ cat:it.cat, emoji:it.emoji, label:it.label, res:res });
    if(res === "right"){ round.score += RIGHT; pulse(binKey); pop("+" + RIGHT, "#7CFC9A", binKey); }
    else if(res === "wrong"){
      round.score += WRONG; pop(String(WRONG), "#ff8a80", binKey);
      var b = binEls[binKey]; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
    }
    hud();
  }
  function pulse(k){ var b = binEls[k]; b.classList.add("pulse"); setTimeout(function(){ b.classList.remove("pulse"); }, 450); }
  function pop(text, color, k){
    var s = document.createElement("div"); s.className = "spark"; s.textContent = text; s.style.color = color;
    var r = binRect[k]; s.style.left = (r.left + r.width/2 - 18) + "px"; s.style.top = (r.top - 34) + "px";
    stage.appendChild(s); setTimeout(function(){ s.remove(); }, 800);
  }
  function hud(){
    var total = game.total + round.score;
    subEl.classList.toggle("neg", total < 0);
    subEl.innerHTML = "Round " + game.round + "/" + ROUNDS + " &nbsp;·&nbsp; Points: <b>" + total +
      "</b> &nbsp;·&nbsp; Item " + Math.min(ROUND_SIZE, round.results.length + 1) + "/" + ROUND_SIZE;
  }

  function startRound(){
    hideCard(); clearItems(); capEl.classList.remove("show");
    if(!game || game.round >= ROUNDS) game = { round: 0, total: 0 };
    game.round++;
    mode = "round"; round = { queue: drawRound(), results: [], score: 0 };
    startBtn.style.display = "none"; subEl.style.opacity = 1; hud();
    nextSpawn = 0; lastTouch = performance.now();
  }
  function endRound(){
    mode = "results"; lastTouch = performance.now();
    var n = { right:0, wrong:0, missed:0 };
    round.results.forEach(function(r){ n[r.res]++; });
    game.total += round.score;
    var lastRound = game.round >= ROUNDS;
    var mark = { right:"✅ Correct", wrong:"❌ Wrong bin", missed:"⏱ Missed" };
    var h = "<h2>Round " + game.round + " of " + ROUNDS + " over</h2><div class='big" + (round.score < 0 ? " neg" : "") + "'>" +
      (round.score > 0 ? "+" : "") + round.score + " points</div><div class='tally'>✅ " + n.right + " correct &nbsp; ❌ " +
      n.wrong + " wrong &nbsp; ⏱ " + n.missed + " missed<br>Total so far: " + game.total + " points</div><h3>Correct answers</h3>";
    ORDER.forEach(function(k){
      var rows = round.results.filter(function(r){ return r.cat === k; });
      if(!rows.length) return;
      var c = CATS[k];
      h += "<div class='grp' style='--g:" + c.color + "'><div class='t'>" + c.icon + " " + c.name +
           (k === "spc" ? " waste" : "") + "</div><div class='w'>" + c.where + "</div>";
      rows.forEach(function(r){ h += "<div class='r'><span>" + r.emoji + " " + r.label + "</span><span>" + mark[r.res] + "</span></div>"; });
      h += "</div>";
    });
    h += "<button id='again'>" + (lastRound ? "See your final result" : "▶ Next round (" + (game.round + 1) + " of " + ROUNDS + ")") + "</button>";
    cardEl.style.setProperty("--c", "#f2c94c"); cardEl.innerHTML = h; cardEl.scrollTop = 0;
    cardEl.classList.add("show");
    $("again").addEventListener("click", function(e){ e.stopPropagation(); if(lastRound) congrats(); else startRound(); });
    subEl.innerHTML = "";
  }
  function congrats(){
    lastTouch = performance.now();
    if(game.total > best){ best = game.total; try{ localStorage.setItem("swm4best", String(best)); }catch(_){} }
    var max = ROUNDS * ROUND_SIZE * RIGHT;
    var h = "<div style='text-align:center'><div style='font-size:54px'>🎉</div><h2>Congratulations!</h2>" +
      "<p>You have completed all " + ROUNDS + " rounds.</p><div class='big" + (game.total < 0 ? " neg" : "") + "'>" + game.total +
      " points</div><div class='tally'>out of " + max + " &nbsp;·&nbsp; Best: " + best + "</div>" +
      "<p style='font-size:17px;color:#fff'><b>Now make your home, your village and your area clean.</b></p>" +
      "<p>Segregate your waste into 4 streams every day:</p></div>";
    ORDER.forEach(function(k){
      var c = CATS[k];
      h += "<div class='grp' style='--g:" + c.color + "'><div class='t'>" + c.icon + " " + c.name + (k === "spc" ? " waste" : "") +
           "</div><div class='w'>" + c.where + "</div></div>";
    });
    if(/^https?:/.test(location.protocol)){
      var msg = "I scored " + game.total + " points in Segregate in 4, the SWM Rules 2026 waste segregation game. Can you beat me? " + location.href.split("#")[0];
      h += "<button id='wa' style='background:#25D366;color:#fff'>Share on WhatsApp</button>";
    }
    h += "<button id='again'>▶ Play again</button>";
    cardEl.innerHTML = h; cardEl.scrollTop = 0; cardEl.classList.add("show");
    $("again").addEventListener("click", function(e){ e.stopPropagation(); startRound(); });
    if($("wa")) $("wa").addEventListener("click", function(e){ e.stopPropagation(); window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank"); });
    for(var i = 0; i < 18; i++){ (function(i){ setTimeout(function(){
      var s = document.createElement("div"); s.className = "spark"; s.style.zIndex = 10;
      s.textContent = ["🎉","✨","🌱","♻️"][i % 4];
      s.style.left = (Math.random()*(W-30)) + "px"; s.style.top = (H*0.25 + Math.random()*H*0.5) + "px";
      stage.appendChild(s); setTimeout(function(){ s.remove(); }, 800);
    }, i*110); })(i); }
  }
  function toDemo(){
    hideCard(); clearItems(); mode = "demo"; round = null; game = null; subEl.classList.remove("neg");
    startBtn.style.display = ""; nextSpawn = 0; fact();
  }
  startBtn.addEventListener("click", startRound);

  // Demo mode helpers: captions, facts and bin info cards
  var capTimer = 0, cardTimer = 0, fi = 0;
  function say(text, color){
    capEl.textContent = text; capEl.style.borderColor = color; capEl.classList.add("show");
    clearTimeout(capTimer); capTimer = setTimeout(function(){ capEl.classList.remove("show"); }, 3200);
  }
  function showInfo(k){
    var c = CATS[k];
    cardEl.style.setProperty("--c", c.color);
    cardEl.innerHTML = "<h2>"+c.icon+" "+c.name+(k==="spc"?" waste":"")+"</h2><p><b>What goes in:</b> "+c.what+
      "</p><p><b>Where it goes:</b> "+c.where+"</p><small>Tap to close</small>";
    cardEl.classList.add("show");
    clearTimeout(cardTimer); cardTimer = setTimeout(function(){ if(mode === "demo") hideCard(); }, 8000);
  }
  function hideCard(){ cardEl.classList.remove("show"); }
  cardEl.addEventListener("click", function(){ if(mode === "demo") hideCard(); });
  function fact(){
    if(mode !== "demo") return;
    subEl.style.opacity = 0;
    setTimeout(function(){ if(mode !== "demo") return; subEl.textContent = FACTS[fi % FACTS.length]; fi++; subEl.style.opacity = 1; }, 400);
  }
  fact(); setInterval(fact, 6000);

  function tick(t){
    var dt = Math.min(0.05, (t - last)/1000); last = t;
    var top0 = headerBottom() + 30, span = Math.max(80, binTop - top0);
    var demo = mode === "demo";
    var speed = span / (demo ? 8 : 10);

    if(demo && t > nextSpawn && items.length < (W > 700 ? 7 : 5)){
      if(!bag.length) bag = shuffled();
      spawn(bag.pop()); nextSpawn = t + 1900;
    }
    if(mode === "round" && round.queue.length && t > nextSpawn && items.length < 4){
      spawn(round.queue.pop()); nextSpawn = t + 2300;
    }

    for(var i = items.length - 1; i >= 0; i--){
      var it = items[i];
      if(it.state === "done"){ items.splice(i,1); continue; }
      it.alpha = Math.min(1, it.alpha + dt*2);
      if(it.state === "fall"){
        it.y += speed*dt; it.phase += dt;
        if(demo && it.y > top0 + span*0.28){
          var r = binRect[it.cat];
          it.x += (r.left + r.width/2 - it.x) * Math.min(1, dt*2.4);
        }
        if(it.y >= binTop - 8){
          if(demo){
            it.state = "done"; it.el.classList.add("gone");
            (function(el){ setTimeout(function(){ el.remove(); }, 300); })(it.el);
            pulse(it.cat); say(it.emoji + " " + it.label + " → " + CATS[it.cat].name, CATS[it.cat].color);
          } else { resolve(it, "missed", null); }
          continue;
        }
      }
      var sway = it.state === "drag" ? 0 : Math.sin(it.phase*1.3)*10;
      var x = Math.max(46, Math.min(W-46, it.x + sway));
      it.el.style.opacity = it.alpha;
      it.el.style.transform = "translate("+x+"px,"+it.y+"px) translate(-50%,-50%)";
    }

    if(mode === "round" && !round.queue.length && !items.length && round.results.length >= ROUND_SIZE) endRound();
    if(mode === "results" && t - lastTouch > 60000) toDemo();   // back to screensaver when left alone
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(function(t){ last = t; tick(t); });

  // Keep the screen awake (works after the first touch on supported browsers)
  var lock = null;
  function wake(){
    if(!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l; l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  document.addEventListener("pointerdown", function(){ lastTouch = performance.now(); wake(); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible"){ wake(); layout(); } });
  wake();

  var root = document.documentElement;
  var reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
  var standalone = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
  if(reqFs && !standalone){
    fsBtn.style.display = "block";
    fsBtn.addEventListener("click", function(){
      if(document.fullscreenElement || document.webkitFullscreenElement){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else { reqFs.call(root); }
      setTimeout(layout, 400);
    });
  }
})();
</script>
</body>
